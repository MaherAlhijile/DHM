<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microscope Control Panel</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>

  <!-- ── Microscope Parameters popup ── -->
  <div class="popup" id="popup-microscope">
    <div class="popup-content">
      <button class="close-btn" onclick="closePopup('popup-microscope')">✕</button>
      <h2>Microscope Parameters</h2>
      <div class="form-grid">
        <label for="wavelength">Wavelength (µm)</label>
        <input id="wavelength" type="number" min="0" value="0.650" step="0.001" />
        <label for="magnification">Magnification</label>
        <input id="magnification" type="number" value="10" />
        <label for="pixelSize">Camera Pixel Size (µm)</label>
        <input id="pixelSize" type="number" value="1.0" step="0.1" />
        <label for="ri">RI Difference</label>
        <input id="ri" type="number" value="1" step="0.1" />
        <label for="filterType">Filter Type</label>
        <select id="filterType"><option>circle</option><option>square</option></select>
        <label for="filterSize">Filter Size (px)</label>
        <input id="filterSize" type="number" value="101" />
        <label for="beams">Number of Beams</label>
        <select id="beams"><option>1 Beam</option><option>2 Beams</option></select>
        <label for="skipPixels">Pixels not used in scanning</label>
        <input id="skipPixels" type="number" value="20" />
      </div>
    </div>
  </div>

  <!-- ── Connection Parameters popup ── -->
  <div class="popup" id="popup-connection">
    <div class="popup-content">
      <button class="close-btn" onclick="closePopup('popup-connection')">✕</button>
      <h2>Connection Parameters</h2>
      <div class="form-grid">
        <label for="ipAddress">IP Address</label>
        <input id="ipAddress" type="text" placeholder="192.168.1.1" />
        <label for="port">Port</label>
        <input id="port" type="number" placeholder="8000" />
        <label for="connectionType">Connection Type</label>
        <select id="connectionType">
          <option value="local">Local</option>
          <option value="remote">Remote</option>
        </select>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════ -->
  <div class="app-layout">

    <!-- ── LEFT PANEL ── -->
    <aside class="panel panel-left">

      <section class="card">
        <h2 class="card-title">Configuration</h2>
        <div class="btn-row">
          <button onclick="openPopup('popup-microscope')">Microscope Parameters</button>
          <button onclick="openPopup('popup-connection')">Connection Parameters</button>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">Images</h2>
        <div class="file-row">
          <label for="imageFile">Object image</label>
          <input type="file" id="imageFile" accept="image/*" />
        </div>
        <div class="file-row">
          <label for="refFile">Reference image</label>
          <input type="file" id="refFile" accept="image/*" />
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">Captured Output</h2>
        <div class="outputs-grid">

          <div class="output-cell">
            <div class="output-box" id="phaseOutput">
              <span class="output-label">Phase Difference</span>
              <div style="position:relative;display:inline-block;">
                <img id="phaseImage" style="max-width:100%;" />
                <canvas id="roiCanvas" style="position:absolute;left:0;top:0;"></canvas>
              </div>
            </div>
            <button id="phaseDiff">Phase Difference</button>
          </div>

          <div class="output-cell">
            <div class="output-box" id="roiOutput">
              <span class="output-label">Region of Interest</span>
            </div>
            <button id="selectRoiBtn">Select ROI</button>
          </div>

          <div class="output-cell">
            <div class="output-box" id="output3D">
              <span class="output-label">3D Profile</span>
            </div>
            <button id="3dbtn">3D Profile</button>
          </div>

          <div class="output-cell">
            <div class="output-box" id="output1D">
              <span class="output-label">1D Profile</span>
            </div>
            <button id="1dbtn">1D Profile</button>
          </div>

        </div>
      </section>

    </aside>

    <!-- ── RIGHT PANEL ── -->
    <main class="panel panel-right">

      <!-- Camera feed -->
      <div class="camera-feed-wrapper">

        <div class="camera-topbar">
          <button id="openCam">Start Camera</button>
          <button id="stopCam" class="btn-secondary">Stop Camera</button>
          <button id="freezeBtn" class="btn-secondary">Freeze Frame</button>
          <span class="bar-label">Exposure (µs)</span>
          <input type="number" id="exposureInput" value="150" step="10" class="bar-input" />
          <button id="setExposureBtn">Set</button>
        </div>

        <div class="camera-view" id="cameraView">
          <div class="camera-placeholder">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
                 stroke="#7a9ab8" stroke-width="1.2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 7l-7 5 7 5V7z"/>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
            </svg>
            <span>No camera feed — press Start Camera</span>
          </div>
          <img id="cameraStream" alt="" />
        </div>

        <div class="camera-bottombar">
          <button id="captureImageBtn">Capture Image</button>
          <select id="captureType">
            <option value="object">As Object</option>
            <option value="reference">As Reference</option>
          </select>
        </div>

      </div>

      <!-- Stage controls -->
      <div class="stage-controls">

        <div class="stage-block">
          <p class="stage-label">X / Y Stage</p>
          <div class="dpad">
            <div class="dpad-empty"></div>
            <button class="dpad-btn" id="btn-up"    title="Y+">▲</button>
            <div class="dpad-empty"></div>
            <button class="dpad-btn" id="btn-left"  title="X−">◀</button>
            <div class="dpad-center">XY</div>
            <button class="dpad-btn" id="btn-right" title="X+">▶</button>
            <div class="dpad-empty"></div>
            <button class="dpad-btn" id="btn-down"  title="Y−">▼</button>
            <div class="dpad-empty"></div>
          </div>
        </div>

        <div class="stage-block">
          <p class="stage-label">Focus / Z</p>
          <div class="focus-btns">
            <button class="dpad-btn focus-btn" id="btn-z-up">Focus +</button>
            <button class="dpad-btn focus-btn" id="btn-z-down">Focus −</button>
          </div>
        </div>

        <div class="stage-block">
          <p class="stage-label">Steps per click</p>
          <input type="number" id="stepsInput" value="50" min="1" max="500" step="10" class="steps-input" />
          <button class="btn-stop" id="btn-stop">■ Stop all</button>
          <p class="status-text" id="dpad-status"></p>
        </div>

      </div>

    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/motors.js"></script>
  <script>
    function openPopup(id)  { document.getElementById(id).style.display = 'flex'; }
    function closePopup(id) { document.getElementById(id).style.display = 'none'; }
    document.querySelectorAll('.popup').forEach(p => {
      p.addEventListener('click', e => { if (e.target === p) closePopup(p.id); });
    });
  </script>

</body>
</html>
